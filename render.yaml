services:
  - type: web
    name: sms-spam-detector-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOW_REGISTRATION
        value: "1"
      - key: TV4_DATABASE
        value: /tmp/tv4.sqlite3
      - key: COOKIE_SECURE
        value: "1"
      - key: APP_ORIGIN
        value: https://de-tai-18-sms-ai.onrender.com
      - key: ALLOWED_HOSTS
        value: de-tai-18-sms-ai.onrender.com,localhost,127.0.0.1
